name: Проверка скриптов
on: [push, pull_request]
jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck
        run: shellcheck -S warning install.sh export.sh backup.sh setup-account.sh bootstrap.sh .githooks/pre-commit config/bin/keyhints
